name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    uses: ./.github/workflows/reusable-node-ci.yml
    permissions:
      contents: read
      pull-requests: read
    with:
      verify-script: verify

  pr-title:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/reusable-pr-title.yml
    permissions:
      pull-requests: read
